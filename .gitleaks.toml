# gitleaks configuration (spec §7, "Repo hygiene").
#
# Run by lefthook over what is staged, and by CI over the full history.
# Nothing here loosens a rule.
#
# ## No path allow lists. Ever.
#
# A `paths` entry in a global allow list makes gitleaks skip the **whole file**
# before it matches a single rule - and it does so even with
# `condition = "AND"` and a `regexes` list beside it, which reads like it would
# narrow the exemption and does not (verified against gitleaks 8.30: a
# `ghp_...` token planted in a path-allow-listed file produced zero findings,
# while the same token in an identical file at another path produced one).
#
# So a path allow list is a place in the repository where secrets are invisible,
# which is the opposite of what one is for. Every exemption below is therefore
# an **exact, anchored literal** and nothing else. Change the value and the
# exemption stops applying; paste anything else secret-shaped into any file,
# allow-listed or not, and it is still a finding.
#
# The two literals are each pinned a second time by a unit test - the files they
# live in are asserted to contain those exact values and nothing else
# secret-shaped (apps/web/test/env-example.test.ts, apps/web/test/ci-fixture.test.ts).
#
#   gitleaks git --config .gitleaks.toml .           # full history
#   gitleaks git --staged --config .gitleaks.toml    # what is staged

title = "Budget Bot"

# The upstream rule set, in full. This file adds to it and takes nothing away.
[extend]
useDefault = true

[[allowlists]]
description = "Two documented dummies that have to look like the real thing"
regexes = [
  # ci/env.production.fixture and apps/web/test/env.test.ts. A GitHub OAuth
  # client id, shaped like one so the boot assertion accepts it: the literal
  # string "Iv1." followed by sixteen hex digits in ascending order.
  '''^Iv1\.0123456789abcdef$''',
  # ci/env.production.fixture. Base64 that decodes to exactly 32 bytes, because
  # that is what the assertion measures. The bytes are the ASCII sentence
  # "not-a-real-key--not-a-real-key32".
  '''^bm90LWEtcmVhbC1rZXktLW5vdC1hLXJlYWwta2V5MzI=$''',
]
