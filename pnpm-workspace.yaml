packages:
  - "apps/*"
  - "packages/*"

# eslint-config-next pulls in unrs-resolver, whose postinstall only fetches a
# native binary as a fallback; pnpm already installs the right one as an
# optional dependency, so the script is deliberately not run. esbuild (via
# vitest and drizzle-kit) and sharp (an optional dependency of Next 15, for
# image optimisation) are the same story.
allowBuilds:
  esbuild: false
  lefthook: true
  sharp: false
  unrs-resolver: false

# `next` bundles postcss, and the version it pins carries two high advisories
# (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849) that are fixed in 8.5.18. postcss
# is API-stable across 8.x, so the override is cheaper than waiting for Next.
#
# Next 15 carries sharp as an optional dependency for image optimisation, and
# the range it asks for (^0.34.3) inherits four high libvips advisories
# (GHSA-f88m-g3jw-g9cj), fixed in 0.35.0. Next uses the handful of sharp calls
# that did not change across that minor, and this app renders no `next/image`
# at all, so the override costs nothing.
overrides:
  postcss: "^8.5.18"
  sharp: "^0.35.3"
